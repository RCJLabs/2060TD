<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>LAST LINE</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #101210;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #app {
        width: 100%;
        height: 100%;
        height: 100dvh; /* mobile browsers: exclude the URL bar */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: auto;
      }

      /* The boot card. Inline and above the module tag on purpose: it paints
         on the FIRST paint, before 420KB of engine has been fetched, parsed
         and booted. Everything it needs is here — no fonts, no images, no
         second request. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #101210;
        color: #c9c6b8;
        font: 400 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        text-align: center;
        padding: 24px;
        z-index: 10;
        transition: opacity 260ms ease-out;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .title {
        font-size: clamp(28px, 9vw, 54px);
        letter-spacing: 0.22em;
        color: #e8e4d5;
      }
      #boot .sub {
        font-size: 12px;
        color: #7d8a6a;
      }
      #boot .bar {
        width: min(260px, 62vw);
        height: 2px;
        background: #23271f;
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        width: 38%;
        height: 100%;
        background: #7d8a6a;
        animation: sweep 1100ms ease-in-out infinite;
      }
      @keyframes sweep {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(370%); }
      }
      #boot .note {
        font-size: 11px;
        color: #4d5347;
        max-width: 34ch;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot { transition: none; }
        #boot .bar i { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="title">LAST LINE</div>
      <div class="sub">ESTABLISHING LINK</div>
      <div class="bar"><i></i></div>
      <div class="note">An alternate history. 2027.</div>
    </div>
    <div id="app"></div>
    <script>
      // Inline, so it still runs when the module itself is what failed to
      // load. A card that spins forever tells the player nothing.
      window.__bootTimer = setTimeout(function () {
        var card = document.getElementById('boot');
        if (!card || card.classList.contains('gone')) return;
        var sub = card.querySelector('.sub');
        if (sub) sub.textContent = 'LINK FAILED — RELOAD TO RETRY';
        var bar = card.querySelector('.bar');
        if (bar) bar.style.visibility = 'hidden';
      }, 20000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
